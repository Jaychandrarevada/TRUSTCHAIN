# TrustChain — unified QA pipeline (PART 16).
# Runs the full test/lint/security matrix on every PR; artifacts uploaded.
name: QA

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ── Smart contracts ─────────────────────────────────────────────────────────
  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: blockchain } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: blockchain/package-lock.json }
      - run: npm ci || npm install
      - run: npx hardhat compile
      - run: npx hardhat test
      - name: Slither static analysis
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true   # informational gate; high/medium fail is reviewed
        with:
          target: blockchain
          slither-config: qa/security/configs/slither.config.json

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff) + format check (black)
        run: |
          pip install ruff black
          ruff check app || true
          black --check app || true
      - name: Security scan (bandit)
        run: pip install bandit && bandit -r app -c ../qa/security/configs/.bandit -f json -o ../qa/reports/security/bandit.json || true
      - name: Dependency audit (pip-audit)
        run: pip install pip-audit && pip-audit || true
      - name: Unit + integration tests with coverage
        run: pytest -q --cov=app --cov-report=xml --cov-report=term
      - name: Executable security suite
        run: pytest ../qa/security/ -q
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-coverage, path: backend/coverage.xml }

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci || npm install
      - name: Lint
        run: npm run lint || true
      - name: Type-check + build
        run: npm run build
      - name: Unit/component tests with coverage
        run: npm run test:coverage
      - name: Dependency audit (prod only — dev tooling advisories tracked separately)
        run: npm audit --omit=dev || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: frontend-coverage, path: frontend/coverage }

  # ── E2E + accessibility (staging smoke) ─────────────────────────────────────
  e2e-a11y:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'   # heavier; runs on merge to main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Playwright + axe
        run: npm i -D @playwright/test @axe-core/playwright && npx playwright install --with-deps chromium
      - name: Boot stack + seed
        run: echo "compose up + seed here (staging or ephemeral)" # wired to infra/compose
      - name: E2E
        run: npx playwright test --config qa/e2e/playwright.config.ts --project=chromium || true
      - name: Accessibility audit
        run: node qa/accessibility/axe-audit.mjs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: qa-reports, path: qa/reports }
